<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;color:#1a1a1a;font-family:'Courier Prime','Courier New',monospace;min-height:100vh;}
.wrap{max-width:680px;margin:0 auto;padding-bottom:80px;}

/* HEADER */
.header{padding:20px 18px 0;border-bottom:1px solid #ddd;display:flex;align-items:flex-end;justify-content:space-between;}

.edit-toggle{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:0.2em;padding:5px 12px;border-radius:3px;border:1.5px solid #ddd;background:#fff;color:#aaa;cursor:pointer;margin-bottom:12px;transition:all 0.15s;}
.edit-toggle.active{border-color:#c9a84c;color:#c9a84c;background:#fffbf0;}

/* TABS */
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;background:#f2f2f2;border-bottom:1px solid #ddd;}
.tabs::-webkit-scrollbar{display:none;}
.tab{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:0.12em;color:#999;background:none;border:none;border-bottom:2px solid transparent;padding:10px 16px;cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.tab.on{color:#c9a84c;border-bottom-color:#c9a84c;}
.tab:hover:not(.on){color:#777;}
.save-bar{font-size:9px;letter-spacing:0.2em;color:#4caf7d;text-align:right;padding:4px 18px;height:22px;background:#fff;}
.body{padding:16px 18px;}

/* LABELS */
.lbl{font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:0.25em;color:#aaa;text-transform:uppercase;margin-bottom:10px;margin-top:4px;}

.prop{background:#fafafa;border:1px solid #e0e0e0;border-left:3px solid;border-radius:3px;padding:13px 14px;margin-bottom:9px;position:relative;}
.prop-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px;}
.prop-name{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:0.08em;line-height:1;}
.prop-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.badge{font-size:9px;letter-spacing:0.12em;padding:2px 7px;border-radius:2px;font-weight:700;white-space:nowrap;}
.prop-platform{font-size:10px;color:#999;letter-spacing:0.08em;margin-bottom:4px;}
.prop-desc{font-size:11px;color:#555;line-height:1.6;margin-bottom:6px;}
.prop-action{font-size:10px;color:#999;font-style:italic;border-top:1px solid #eee;padding-top:6px;line-height:1.5;}

/* CHECKLIST ROWS */
.tr{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid #eee;user-select:none;}
.tr:last-child{border-bottom:none;}
.chk{width:15px;height:15px;border:1.5px solid #ccc;border-radius:2px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;cursor:pointer;}

.chk.red{background:#c0392b;border-color:#c0392b;}
.chk.pk{background:#e84393;border-color:#e84393;}
.chk.grn{background:#4caf7d;border-color:#4caf7d;}

.tt{font-size:11px;color:#333;line-height:1.5;flex:1;cursor:pointer;}
.tt.dn{color:#bbb;text-decoration:line-through;}
.pri{font-size:8px;letter-spacing:0.15em;padding:1px 5px;border-radius:2px;margin-top:2px;flex-shrink:0;}

// ── STATE ──────────────────────────────────────────────────────
let state = JSON.parse(JSON.stringify(DEFAULTS));

async function loadState() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/tracker_state?key=eq.main&select=value&limit=1`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    const rows = await res.json();
    if (rows && rows.length && rows[0].value) {
      const saved = JSON.parse(rows[0].value);
      state = Object.assign({}, DEFAULTS, saved);
    }
  } catch(e) { console.error('load error', e); }
}

let saveTimer = null;
function saveState() {
  const bar = document.getElementById('savebar');
  if (bar) bar.textContent = 'SAVING...';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const payload = JSON.stringify(state);
      const res = await fetch(`${SUPABASE_URL}/rest/v1/tracker_state`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'resolution=merge-duplicates'
        },
        body: JSON.stringify({ key: 'main', value: payload })
      });
      if (res.ok || res.status === 201 || res.status === 200) {
        if (bar) { bar.textContent = 'SAVED ✓'; setTimeout(() => { if(bar) bar.textContent = ''; }, 1200); }
      } else {
        const err = await res.text();
        console.error('save error', res.status, err);
        if (bar) { bar.textContent = 'SAVE FAILED'; setTimeout(() => { if(bar) bar.textContent = ''; }, 2000); }
      }
    } catch(e) {
      console.error('save exception', e);
      if (bar) { bar.textContent = 'SAVE FAILED'; setTimeout(() => { if(bar) bar.textContent = ''; }, 2000); }
    }
  }, 400);
}

// ── EDIT MODE ─────────────────────────────────────────────────
function toggleEdit() {
  editMode = !editMode;
  editingId = null;
  document.getElementById('editToggle').classList.toggle('active', editMode);
  render();
}

// ── CHECKBOX ──────────────────────────────────────────────────
function tog(k) {
  state.done[k] = !state.done[k];
  saveState();
  render();
}

// ── GENERIC LIST OPS ──────────────────────────────────────────
function deleteItem(listKey, id) {
  state[listKey] = state[listKey].filter(x => x.id !== id);
  saveState(); render();
}

function startEdit(id) { editingId = id; render(); }
function cancelEdit() { editingId = null; render(); }

function saveCheckItem(listKey, id) {
  const inp = document.getElementById('ei-text-' + id);
  const priEl = document.getElementById('ei-pri-' + id);
  if (!inp) return;
  const item = state[listKey].find(x => x.id === id);
  if (item) {
    item.text = inp.value.trim() || item.text;
    if (priEl) item.priority = priEl.value;
  }
  editingId = null;
  saveState(); render();
}

function addCheckItem(listKey, priority) {
  const inp = document.getElementById('new-item-' + listKey + (priority||''));
  if (!inp || !inp.value.trim()) return;
  const newItem = { id: uid(), text: inp.value.trim() };
  if (priority !== undefined) newItem.priority = priority;
  state[listKey].push(newItem);
  inp.value = '';
  saveState(); render();
}

// ── HELPERS ───────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function chkHTML(id, color) {
  const on = !!state.done[id];
  return `<div class="chk${on?' '+color:''}" onclick="tog('${esc(id)}')">${on?'<span class="cm">✓</span>':''}</div>`;
}

function priStyle(pri) {
  return pri==='high'?'background:#fff0f0;color:#c0392b':pri==='medium'?'background:#fffbf0;color:#b8860b':'background:#f0f0f0;color:#aaa';
}

// ── ROW RENDER ────────────────────────────────────────────────
function rowHTML(listKey, item, color, showPri) {
  const dn = !!state.done[item.id];
  const priTag = (showPri && item.priority) ? `<span class="pri" style="${priStyle(item.priority)}">${item.priority.toUpperCase()}</span>` : '';

  if (editMode && editingId === item.id) {
    const priSelect = showPri ? `
      <div><label>Priority</label>
      <select id="ei-pri-${esc(item.id)}">
        <option value="high"${item.priority==='high'?' selected':''}>High</option>
        <option value="medium"${item.priority==='medium'?' selected':''}>Medium</option>
        <option value="low"${item.priority==='low'?' selected':''}>Low</option>
      </select></div>` : '';
    return `<div class="tr-edit-wrap">
      <div class="edit-form">
        <label>Task text</label>
        <textarea id="ei-text-${esc(item.id)}">${esc(item.text)}</textarea>
        ${priSelect}
        <div class="form-btns">
          <button class="btn-save-item" onclick="saveCheckItem('${listKey}','${esc(item.id)}')">SAVE</button>
          <button class="btn-cancel" onclick="cancelEdit()">CANCEL</button>
        </div>
      </div>
    </div>`;
  }

  const editBtns = editMode ? `<div class="edit-actions">
    <button class="btn-edit" onclick="startEdit('${esc(item.id)}')">EDIT</button>
    <button class="btn-del" onclick="deleteItem('${listKey}','${esc(item.id)}')">✕</button>
  </div>` : '';

  return `<div class="tr">
    ${chkHTML(item.id, color)}
    <div class="tt${dn?' dn':''}" onclick="tog('${esc(item.id)}')">${esc(item.text)}</div>
    ${priTag}
    ${editBtns}
  </div>`;
}

// ── ADD ROW ───────────────────────────────────────────────────
function addRowHTML(listKey, priority) {
  if (!editMode) return '';
  const inputId = 'new-item-' + listKey + (priority||'');
  return `<div style="display:flex;gap:6px;margin-top:8px;align-items:center;">
    <input id="${inputId}" type="text" placeholder="Add new item..." style="flex:1;font-family:'Courier Prime',monospace;font-size:11px;border:1px solid #e0e0e0;border-radius:2px;padding:5px 8px;outline:none;">
    <button class="btn-add" style="margin-top:0;padding:4px 10px;" onclick="addCheckItem('${listKey}','${priority||''}')">+ ADD</button>
  </div>`;
}

// ── PROPERTIES TAB ────────────────────────────────────────────
function saveProp(id) {
  const fields = ['name','role','status','color','platform','desc','action'];
  const item = state.properties.find(p => p.id === id);
  if (!item) return;
  fields.forEach(f => {
    const el = document.getElementById('pe-'+f+'-'+id);
    if (el) item[f] = el.value;
  });
  editingId = null;
  saveState(); render();
}

function addProp() {
  const newProp = {
    id: uid(),
    name: 'New Property',
    role: 'ROLE',
    status: 'ACTIVE',
    color: '#c9a84c',
    platform: '',
    desc: '',
    action: ''
  };
  state.properties.push(newProp);
  editingId = newProp.id;
  saveState(); render();
}

function renderProperties() {
  let h = `<div class="lbl">Brand properties — each has one job</div>`;
  state.properties.forEach(p => {
    if (editMode && editingId === p.id) {
      h += `<div class="prop-edit-form">
        <div class="form-row">
          <div><label>Name</label><input id="pe-name-${p.id}" value="${esc(p.name)}"></div>
          <div><label>Color</label><input id="pe-color-${p.id}" type="color" value="${p.color}" style="height:30px;padding:2px 4px;width:100%;cursor:pointer;"></div>
        </div>
        <div class="form-row">
          <div><label>Role</label><input id="pe-role-${p.id}" value="${esc(p.role)}"></div>
          <div><label>Status</label>
            <select id="pe-status-${p.id}">
              <option${p.status==='ACTIVE'?' selected':''}>ACTIVE</option>
              <option${p.status==='DORMANT'?' selected':''}>DORMANT</option>
              <option${p.status==='FIREWALLED'?' selected':''}>FIREWALLED</option>
            </select>
          </div>
        </div>
        <label>Platform</label><input id="pe-platform-${p.id}" value="${esc(p.platform)}">
        <label>Description</label><textarea id="pe-desc-${p.id}">${esc(p.desc)}</textarea>
        <label>Action needed</label><textarea id="pe-action-${p.id}">${esc(p.action)}</textarea>
        <div class="form-btns">
          <button class="btn-save-item" onclick="saveProp('${p.id}')">SAVE</button>
          <button class="btn-cancel" onclick="cancelEdit()">CANCEL</button>
          <button class="btn-del" onclick="deleteItem('properties','${p.id}')">DELETE</button>
        </div>
      </div>`;
      return;
    }

    const ss = p.status==='ACTIVE'?`background:${p.color}20;color:${p.color}`:p.status==='DORMANT'?'background:#f0f0f0;color:#aaa':'background:#fff0f0;color:#c0392b';
    const editBtn = editMode ? `<button class="btn-edit" style="margin-top:6px;" onclick="startEdit('${p.id}')">EDIT</button>` : '';
    h += `<div class="prop" style="border-left-color:${p.color}">
      <div class="prop-top">
        <div class="prop-name" style="color:${p.color}">${esc(p.name)}</div>
        <div class="prop-right">
          <span class="badge" style="${ss}">${esc(p.status)}</span>
          <span class="badge" style="background:#f0f0f0;color:#999">${esc(p.role)}</span>
          ${editBtn}
        </div>
      </div>
      <div class="prop-platform">${esc(p.platform)}</div>
      <div class="prop-desc">${esc(p.desc)}</div>
      <div class="prop-action">${esc(p.action)}</div>
    </div>`;
  });

  if (editMode) {
    h += `<button class="btn-add" onclick="addProp()">+ ADD PROPERTY</button>`;
  }
  return h;
}

// ── BUILD TAB ─────────────────────────────────────────────────
function renderBuild() {
  const high = state.build.filter(b=>b.priority==='high');
  const med  = state.build.filter(b=>b.priority==='medium');
  const low  = state.build.filter(b=>b.priority==='low');
  const count = state.build.filter(b=>!!state.done[b.id]).length;
  const pct = Math.round((count/Math.max(state.build.length,1))*100);

  return `<div class="prog-lbl">${count} of ${state.build.length} tasks complete</div>
    <div class="prog-wrap"><div class="prog-fill" style="width:${pct}%;background:#c9a84c"></div></div>
    <div class="lbl">High priority — do these first</div>
    <div class="box" style="border-left-color:#c0392b;background:#fff5f5">

    <div class="box" style="border-left-color:#c9a84c">

    </div>
    <div class="lbl" style="margin-top:14px">Low priority — after Colterra activates</div>
    <div class="box" style="border-left-color:#aaa">
      ${low.map(b=>rowHTML('build',b,'gld',true)).join('')}

}

// ── RULES TAB ─────────────────────────────────────────────────
function saveRule(id) {
  const item = state.rules.find(r=>r.id===id);
  if (!item) return;
  const titleEl = document.getElementById('re-title-'+id);
  const bodyEl  = document.getElementById('re-body-'+id);
  const colorEl = document.getElementById('re-color-'+id);
  if (titleEl) item.title = titleEl.value.trim();
  if (bodyEl)  item.body  = bodyEl.value.trim();
  if (colorEl) item.c     = colorEl.value;
  editingId = null;
  saveState(); render();
}

function addRule() {
  const newRule = { id: uid(), title: 'New Rule', body: '', c: '#c9a84c' };
  state.rules.push(newRule);
  editingId = newRule.id;
  saveState(); render();
}

function renderRules() {
  const identity = state.rules.filter(r=>['r1','r2','r3','r4','r5'].includes(r.id) || r._group==='identity');
  const firewall = state.rules.filter(r=>['r6','r7','r8'].includes(r.id) || r._group==='firewall');
  const persona  = state.rules.filter(r=>['r9','r10','r11'].includes(r.id) || r._group==='persona');
  const content  = state.rules.filter(r=>['r12'].includes(r.id) || r._group==='content');
  // unclassified new rules
  const classified = new Set([...identity,...firewall,...persona,...content].map(r=>r.id));
  const other = state.rules.filter(r=>!classified.has(r.id));

  function ruleCard(r) {
    if (editMode && editingId === r.id) {
      return `<div class="prop-edit-form" style="margin-bottom:8px;">
        <div class="form-row">
          <div style="flex:3"><label>Title</label><input id="re-title-${r.id}" value="${esc(r.title)}"></div>
          <div style="flex:1"><label>Color</label><input id="re-color-${r.id}" type="color" value="${r.c}" style="height:30px;width:100%;padding:2px 4px;cursor:pointer;"></div>
        </div>
        <label>Body</label><textarea id="re-body-${r.id}">${esc(r.body)}</textarea>
        <div class="form-btns">
          <button class="btn-save-item" onclick="saveRule('${r.id}')">SAVE</button>
          <button class="btn-cancel" onclick="cancelEdit()">CANCEL</button>
          <button class="btn-del" onclick="deleteItem('rules','${r.id}')">DELETE</button>
        </div>
      </div>`;
    }
    const bg = r.c==='#c0392b'?'#fff5f5':'#fafafa';
    const editBtn = editMode ? `<button class="btn-edit" style="margin-top:4px;" onclick="startEdit('${r.id}')">EDIT</button>` : '';
    return `<div class="box" style="border-left-color:${r.c};background:${bg};margin-bottom:8px;display:flex;flex-direction:column;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;">
        <div class="box-title" style="color:${r.c}">${esc(r.title)}</div>
        ${editBtn}
      </div>
      <div class="box-body">${esc(r.body)}</div>
    </div>`;
  }

  function section(label, arr) {
    if (!arr.length && !editMode) return '';
    return `<div class="lbl" style="margin-top:14px">${label}</div>${arr.map(ruleCard).join('')}`;
  }

  return `<div class="lbl">Locked — these don't get debated in the moment</div>
    ${section('Identity', identity)}
    ${section('Firewall', firewall)}
    ${section('The Persona', persona)}
    ${section('Content', content)}
    ${other.length ? section('Other', other) : ''}
    ${editMode ? `<button class="btn-add" onclick="addRule()">+ ADD RULE</button>` : ''}`;
}

// ── RELEASES TAB ──────────────────────────────────────────────
function renderReleases() {
  const releases = state.releases || [];
  if (!releases.length) return `<div class="lbl">No releases yet</div>${editMode?`<button class="btn-add" onclick="addRelease()">+ ADD RELEASE</button>`:''}`;

  let h = `<div class="lbl">Social Media Release Tracker</div>`;

  releases.forEach(rel => {
    const allTasks = rel.phases.flatMap(ph => ph.tasks);
    const doneCt = allTasks.filter(t => !!state.done[t.id]).length;
    const pct = Math.round((doneCt / Math.max(allTasks.length, 1)) * 100);

    const editBtn = editMode ? `<button class="btn-edit" style="margin-left:8px;vertical-align:middle;" onclick="startEdit('${rel.id}')">EDIT</button>` : '';

    h += `<div style="margin-bottom:24px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.1em;color:${rel.color}">${esc(rel.title)}${editBtn}</div>
        <span style="font-size:10px;color:#aaa;letter-spacing:0.15em;">${doneCt}/${allTasks.length} DONE</span>
      </div>
      <div class="prog-wrap"><div class="prog-fill" style="width:${pct}%;background:${rel.color}"></div></div>`;

    if (editMode && editingId === rel.id) {
      h += `<div class="edit-form">
        <label>Release Title</label><input id="rel-title-${rel.id}" value="${esc(rel.title)}">
        <label>Color</label><input id="rel-color-${rel.id}" type="color" value="${rel.color}" style="height:30px;width:100%;padding:2px 4px;cursor:pointer;">
        <div class="form-btns">
          <button class="btn-save-item" onclick="saveRelease('${rel.id}')">SAVE</button>
          <button class="btn-cancel" onclick="cancelEdit()">CANCEL</button>
          <button class="btn-del" onclick="deleteRelease('${rel.id}')">DELETE RELEASE</button>
        </div>
      </div>`;
    }

    rel.phases.forEach(ph => {
      const phDone = ph.tasks.filter(t => !!state.done[t.id]).length;
      const labelColor = ph.label === 'RELEASE DAY' ? '#c0392b' : ph.label === 'POST-RELEASE' ? '#4caf7d' : '#5b9bd5';
      const labelBg = ph.label === 'RELEASE DAY' ? '#fff0f0' : ph.label === 'POST-RELEASE' ? '#f0fff4' : '#f0f5ff';

      h += `<div class="box" style="border-left-color:${rel.color};margin-bottom:10px;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;">
          <div>
            <span class="badge" style="background:${labelBg};color:${labelColor};margin-bottom:4px;display:inline-block;">${esc(ph.label)}</span>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:0.08em;color:#333;">${esc(ph.name)}</div>
            <div style="font-size:10px;color:#aaa;margin-bottom:4px;">${esc(ph.date)}</div>
          </div>
          <span style="font-size:9px;color:#aaa;letter-spacing:0.1em;flex-shrink:0;">${phDone}/${ph.tasks.length}</span>
        </div>
        <div style="font-size:11px;color:#888;font-style:italic;margin-bottom:8px;line-height:1.5;border-left:2px solid #eee;padding-left:8px;">${esc(ph.goal)}</div>`;

      ph.tasks.forEach(task => {
        if (editMode && editingId === task.id) {
          h += `<div class="edit-form">
            <label>Task</label><textarea id="ei-text-${task.id}">${esc(task.text)}</textarea>
            <div class="form-btns">
              <button class="btn-save-item" onclick="saveReleaseTask('${rel.id}','${ph.id}','${task.id}')">SAVE</button>
              <button class="btn-cancel" onclick="cancelEdit()">CANCEL</button>
            </div>
          </div>`;
        } else {
          const dn = !!state.done[task.id];
          const editBtns = editMode ? `<div class="edit-actions">
            <button class="btn-edit" onclick="startEdit('${task.id}')">EDIT</button>
            <button class="btn-del" onclick="deleteReleaseTask('${rel.id}','${ph.id}','${task.id}')">✕</button>
          </div>` : '';
          h += `<div class="tr">
            <div class="chk${dn?' gld':''}" onclick="tog('${task.id}')">${dn?'<span class="cm">✓</span>':''}</div>
            <div class="tt${dn?' dn':''}" onclick="tog('${task.id}')">${esc(task.text)}</div>
            ${editBtns}
          </div>`;
        }
      });

      if (editMode) {
        h += `<div style="display:flex;gap:6px;margin-top:8px;align-items:center;">
          <input id="new-task-${ph.id}" type="text" placeholder="Add task..." style="flex:1;font-family:'Courier Prime',monospace;font-size:11px;border:1px solid #e0e0e0;border-radius:2px;padding:5px 8px;outline:none;">
          <button class="btn-add" style="margin-top:0;padding:4px 10px;" onclick="addReleaseTask('${rel.id}','${ph.id}')">+ ADD</button>
        </div>`;
      }

      h += `</div>`;
    });

    if (editMode) {
      h += `<button class="btn-add" onclick="addPhase('${rel.id}')">+ ADD PHASE</button>`;
    }

    h += `</div>`;
  });

  if (editMode) {
    h += `<button class="btn-add" style="margin-top:8px;" onclick="addRelease()">+ ADD RELEASE</button>`;
  }

  return h;
}

function saveRelease(relId) {
  const rel = (state.releases||[]).find(r=>r.id===relId);
  if (!rel) return;
  const t = document.getElementById('rel-title-'+relId);
  const c = document.getElementById('rel-color-'+relId);
  if (t) rel.title = t.value.trim() || rel.title;
  if (c) rel.color = c.value;
  editingId = null;
  saveState(); render();
}

function deleteRelease(relId) {
  state.releases = (state.releases||[]).filter(r=>r.id!==relId);
  saveState(); render();
}

function addRelease() {
  if (!state.releases) state.releases = [];
  const newRel = { id: uid(), title: 'New Release', color: '#c9a84c', phases: [] };
  state.releases.push(newRel);
  editingId = newRel.id;
  saveState(); render();
}

function addPhase(relId) {
  const rel = (state.releases||[]).find(r=>r.id===relId);
  if (!rel) return;
  rel.phases.push({ id: uid(), label: 'PRE-RELEASE', name: 'New Phase', date: '', goal: '', tasks: [] });
  saveState(); render();
}

function addReleaseTask(relId, phId) {
  const rel = (state.releases||[]).find(r=>r.id===relId);
  if (!rel) return;
  const ph = rel.phases.find(p=>p.id===phId);
  if (!ph) return;
  const inp = document.getElementById('new-task-'+phId);
  if (!inp || !inp.value.trim()) return;
  ph.tasks.push({ id: uid(), text: inp.value.trim() });
  inp.value = '';
  saveState(); render();
}

function saveReleaseTask(relId, phId, taskId) {
  const rel = (state.releases||[]).find(r=>r.id===relId);
  if (!rel) return;
  const ph = rel.phases.find(p=>p.id===phId);
  if (!ph) return;
  const task = ph.tasks.find(t=>t.id===taskId);
  if (!task) return;
  const inp = document.getElementById('ei-text-'+taskId);
  if (inp) task.text = inp.value.trim() || task.text;
  editingId = null;
  saveState(); render();
}

function deleteReleaseTask(relId, phId, taskId) {
  const rel = (state.releases||[]).find(r=>r.id===relId);
  if (!rel) return;
  const ph = rel.phases.find(p=>p.id===phId);
  if (!ph) return;
  ph.tasks = ph.tasks.filter(t=>t.id!==taskId);
  saveState(); render();
}

// ── MAIN RENDER ───────────────────────────────────────────────
function switchTab(t) { tab=t; editingId=null; render(); }

function render() {
  const TABS=[
    ['properties','Properties'],
    ['build','Build Queue'],
    ['colterra','Colterra'],
    ['ebtf','EBTF'],
    ['scott',"Scott's Campaign"],
    ['releases','Releases'],
    ['health','Health'],
    ['finances','Finances'],
    ['rules','Rules'],
  ];
  document.getElementById('tabs').innerHTML = TABS.map(([id,lb])=>
    `<button class="tab${tab===id?' on':''}" onclick="switchTab('${id}')">${lb}</button>`
  ).join('');

  let content = '';
  if (tab==='properties') content = renderProperties();
  else if (tab==='build')     content = renderBuild();
  else if (tab==='colterra')  content = renderColterra();
  else if (tab==='ebtf')      content = renderEBTF();
  else if (tab==='scott')     content = renderScott();
  else if (tab==='releases')  content = renderReleases();
  else if (tab==='health')    content = renderHealth();
  else if (tab==='finances')  content = renderFinances();
  else if (tab==='rules')     content = renderRules();
  document.getElementById('body').innerHTML = content;
}

// ── INIT ──────────────────────────────────────────────────────
const bar = document.getElementById('savebar');
if (bar) bar.textContent = 'LOADING...';
loadState().then(() => { render(); });
</script>
